<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy2FA — 核心逻辑自测</title>
<style>
  :root{ color-scheme: dark; }
  body{ margin:0; padding:32px; background:#06090c; color:#eaf2f5; font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Monaco,monospace; }
  h1{ font-size:18px; letter-spacing:.04em; }
  .note{ color:#9fb3bf; font-size:12px; margin:-6px 0 18px; }
  #summary{ font-size:16px; font-weight:700; padding:10px 14px; border-radius:10px; margin:14px 0; display:inline-block; }
  .ok{ background:rgba(52,211,153,.14); color:#34d399; border:1px solid rgba(52,211,153,.4); }
  .fail{ background:rgba(251,113,133,.14); color:#fb7185; border:1px solid rgba(251,113,133,.4); }
  .row{ padding:6px 10px; border-bottom:1px solid rgba(255,255,255,.06); display:flex; gap:10px; }
  .row .s{ flex:none; width:48px; font-weight:700; }
  .pass .s{ color:#34d399; } .err .s{ color:#fb7185; }
  .err{ background:rgba(251,113,133,.06); }
  .d{ color:#9fb3bf; }
  h2{ font-size:13px; letter-spacing:.08em; color:#22d3ee; margin:22px 0 4px; text-transform:uppercase; }
</style>
</head>
<body>
<h1>Easy2FA — 核心逻辑自测</h1>
<p class="note">本页<b>直接从 index.html 提取真实实现</b>来执行——无镜像副本、零漂移：改了 index.html 刷新本页即测最新代码。<br>
需经 <b>localhost</b> 或 <b>HTTPS</b> 打开（Web Crypto 与 fetch 需要安全上下文；<code>file://</code> 不行）。</p>
<div id="summary">运行中…</div>
<div id="out"></div>

<script>
// ============================================================================
// 从 index.html 抠出 Component 的纯逻辑方法，拼成对象字面量执行。
// 方法体内的 this.xxx 互调用在对象上天然成立；state/ACCENTS 由这里 mock。
// 任何方法找不到 / 花括号不配对都会让整页 FAIL——比"镜像忘了同步"沉默腐烂强。
// ============================================================================
const METHODS = [
  'base32Decode', 'base32Encode', 'totp', 'utf8', 'b64ToBytes',
  'pbReaders', 'decodeMigration', 'decodeOtpParam', 'parseMigration',
  'clampDigits', 'clampPeriod', 'normAlgo', 'otpParams', 'otpParamError',
  'loadFromHash', 'commitParse', 'loadBoard', 'saveBoard',
  'parseInput', 'parseAccountUrl', 'parseAccountsFromText',
  'parseStructured', 'accountFromRecord', 'csvSplit',
  'hashStr', 'pickColor', 'normalizeAccount', 'otpIdentity', 'accountIdentity',
  'refresh', 'refreshPreview', 'computeBoardCodes', 'invalidateCodeWork', 'addAccounts', 'animateTo', 'goBoard', 'goSetup', 'boardTick', 'tick',
  'encodeBoardParam', 'decodeBoardParam', 'buildAccountUrl', 'fmtCode',
];

function extractMethod(html, name) {
  // class 方法两空格缩进起行；调用点（this.xxx( ）不会被 \n␣␣ 前缀匹配到
  const re = new RegExp('\\n  (?:async )?' + name + '\\s*\\(');
  const m = re.exec(html);
  if (!m) throw new Error('index.html 中未找到方法 ' + name + '()');
  const open = html.indexOf('{', m.index + m[0].length - 1);
  let depth = 0, j = open;
  for (; j < html.length; j++) {
    if (html[j] === '{') depth++;
    else if (html[j] === '}') { depth--; if (depth === 0) break; }
  }
  if (depth !== 0) throw new Error('方法 ' + name + '() 花括号不配对（提取失败）');
  return html.slice(m.index + 1, j + 1);
}

async function loadApp() {
  // cache:'no-store'：sw.js 对这类请求直接放行，保证抓到的是磁盘上最新的 index.html
  const res = await fetch('./index.html', { cache: 'no-store' });
  if (!res.ok) throw new Error('无法读取 index.html：HTTP ' + res.status);
  const html = await res.text();
  const src = METHODS.map((n) => extractMethod(html, n));
  const app = new Function('return {\n' + src.join(',\n') + '\n};')();
  const am = /ACCENTS = (\[[^\]]*\])/.exec(html);
  app.ACCENTS = am ? JSON.parse(am[1].replace(/'/g, '"')) : ['#22d3ee'];
  app.state = { accounts: [] };
  return app;
}

// ============================================================================
// 测试工具
// ============================================================================
const results = [];
let section = '';
function group(name){ section = name; results.push({group:name}); }
function check(name, cond, detail){ results.push({name, ok:!!cond, detail:detail||''}); }
async function eq(name, got, want){ const g = await got; check(name, g === want, 'got ' + JSON.stringify(g) + ' / want ' + JSON.stringify(want)); }
function ascii(s){ return new Uint8Array([...s].map(c => c.charCodeAt(0))); }
function bytesEq(a, b){ if(!a || !b || a.length !== b.length) return false; for(let i = 0; i < a.length; i++) if(a[i] !== b[i]) return false; return true; }
function varintEnc(n){ const b = []; while(n > 0x7f){ b.push((n & 0x7f) | 0x80); n = Math.floor(n / 128); } b.push(n); return b; }
function pbField(tag, bytes){ return [tag, ...varintEnc(bytes.length), ...bytes]; }
function b64url(arr){ let s = ''; for(const x of arr) s += String.fromCharCode(x); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

async function run(){
  const app = await loadApp();
  group('提取器');
  check('从 index.html 提取 ' + METHODS.length + ' 个真实方法', true);

  // ---- RFC 6238 Appendix B 向量（8 位、period 30）----
  group('TOTP · RFC 6238');
  const SHA1   = app.base32Encode(ascii('12345678901234567890'));
  const SHA256 = app.base32Encode(ascii('12345678901234567890123456789012'));
  const SHA512 = app.base32Encode(ascii('1234567890123456789012345678901234567890123456789012345678901234'));
  const vectors = [
    [59,          '94287082','46119246','90693936'],
    [1111111109,  '07081804','68084774','25091201'],
    [1111111111,  '14050471','67062674','99943326'],
    [1234567890,  '89005924','91819424','93441116'],
    [2000000000,  '69279037','90698825','38618901'],
  ];
  for(const [T, s1, s256, s512] of vectors){
    await eq('RFC6238 T=' + T + ' SHA-1',   app.totp(SHA1,   T, 8, 30, 'SHA-1'),   s1);
    await eq('RFC6238 T=' + T + ' SHA-256', app.totp(SHA256, T, 8, 30, 'SHA-256'), s256);
    await eq('RFC6238 T=' + T + ' SHA-512', app.totp(SHA512, T, 8, 30, 'SHA-512'), s512);
  }

  // ---- base32 ----
  group('base32');
  check('base32Decode("JBSWY3DPEHPK3PXP") = "Hello!"+deadbeef',
    bytesEq(app.base32Decode('JBSWY3DPEHPK3PXP'), new Uint8Array([0x48,0x65,0x6c,0x6c,0x6f,0x21,0xde,0xad,0xbe,0xef])));
  check('base32 大小写无关', bytesEq(app.base32Decode('jbswy3dpehpk3pxp'), app.base32Decode('JBSWY3DPEHPK3PXP')));
  check('base32Decode 非法字符 → null', app.base32Decode('JBSW!!!0189') === null);
  for(const arr of [[1],[0,255],[1,2,3,4,5],[72,101,108,108,111,33,222,173,190,239]]){
    const b = new Uint8Array(arr);
    check('base32 往返 [' + arr.join(',') + ']', bytesEq(app.base32Decode(app.base32Encode(b)), b));
  }

  // ---- 参数 clamp / 算法归一 ----
  group('clamp / normAlgo');
  check('clampDigits("7")=7', app.clampDigits('7') === 7);
  check('clampDigits("9")→null（拒绝越界）', app.clampDigits('9') === null);
  check('clampDigits(undefined)→6', app.clampDigits(undefined) === 6);
  check('clampPeriod("60")=60', app.clampPeriod('60') === 60);
  check('clampPeriod("5")→null（下限 10）', app.clampPeriod('5') === null);
  check('clampPeriod("301")→null（上限 300）', app.clampPeriod('301') === null);
  check('normAlgo("SHA256")=SHA-256', app.normAlgo('SHA256') === 'SHA-256');
  check('normAlgo("sha-512")=SHA-512', app.normAlgo('sha-512') === 'SHA-512');
  check('normAlgo("SHA1")=SHA-1', app.normAlgo('SHA1') === 'SHA-1');
  check('normAlgo(null)=null', app.normAlgo(null) === null);
  check('normAlgo("MD5")→null（拒绝未知算法）', app.normAlgo('MD5') === null);

  // ---- parseInput（setup 输入解析）----
  group('parseInput');
  const pi = app.parseInput('otpauth://totp/Acme:bob?secret=JBSWY3DPEHPK3PXP&issuer=Acme&digits=8&period=60&algorithm=SHA256');
  check('otpauth 完整解析 valid', pi && pi.valid);
  check('otpauth issuer=Acme', pi && pi.issuer === 'Acme');
  check('otpauth label=bob（issuer 前缀剥离）', pi && pi.label === 'bob');
  check('otpauth digits=8', pi && pi.digits === 8);
  check('otpauth period=60', pi && pi.period === 60);
  check('otpauth algorithm=SHA-256', pi && pi.algorithm === 'SHA-256');
  const ph = app.parseInput('otpauth://hotp/x?secret=JBSWY3DPEHPK3PXP');
  check('HOTP 链接被拒（valid=false, reason=hotp）', ph && !ph.valid && ph.reason === 'hotp');
  check('裸密钥带空格小写 → valid', (app.parseInput('jbsw y3dp ehpk 3pxp') || {}).valid === true);
  check('非法字符裸密钥 → invalid', (app.parseInput('0189') || {}).valid === false);
  const pl = app.parseInput('otpauth://totp/prod-db?secret=JBSWY3DPEHPK3PXP');
  check('无 issuer 前缀时 label=整个路径', pl && pl.valid && pl.label === 'prod-db' && pl.issuer === '');

  // ---- parseAccountUrl（书签链接）----
  group('parseAccountUrl');
  const pa = app.parseAccountUrl('https://x.example/2fa/#secret=JBSWY3DPEHPK3PXP&label=GitHub&digits=8&period=60&algorithm=256');
  check('书签链接解析 valid', pa && pa.valid);
  check('书签 label=GitHub', pa && pa.label === 'GitHub');
  check('书签 digits=8 period=60 algo=SHA-256', pa && pa.digits === 8 && pa.period === 60 && pa.algorithm === 'SHA-256');
  check('无 secret 的 URL → null', app.parseAccountUrl('https://x.example/#label=nope') === null);

  // ---- parseAccountsFromText（混合文本抠链接 + 去重）----
  group('parseAccountsFromText');
  const mixed = [
    '# 我的测试号（注释行应被忽略）',
    'otpauth://totp/Acme:bob?secret=JBSWY3DPEHPK3PXP&issuer=Acme',
    '一些噪声行 hello world',
    'https://tool.example/2fa/#secret=GEZDGNBVGY3TQOJQ&label=Stripe',
    'secret=MFRGGZDFMZTWQ2LK&label=BareLine',
    'otpauth://totp/Acme:bob?secret=JBSWY3DPEHPK3PXP&issuer=Acme',
  ].join('\n');
  const accs = app.parseAccountsFromText(mixed);
  check('混合文本抠出 3 个（重复 otpauth 去重）', accs.length === 3, 'got ' + accs.length);
  check('第 1 条：otpauth bob@Acme', accs[0] && accs[0].label === 'bob' && accs[0].issuer === 'Acme');
  check('第 2 条：书签 Stripe', accs[1] && accs[1].label === 'Stripe' && accs[1].secret === 'GEZDGNBVGY3TQOJQ');
  check('第 3 条：裸 secret= 行', accs[2] && accs[2].label === 'BareLine' && accs[2].secret === 'MFRGGZDFMZTWQ2LK');
  check('空文本 → []', app.parseAccountsFromText('').length === 0);
  check('纯噪声 → []', app.parseAccountsFromText('nothing to see\nhere').length === 0);

  // ---- JSON / CSV 结构化导入（issue #5：picker 的 .json/.csv 现在真能解析）----
  group('parseStructured · JSON/CSV');
  // JSON：数组 of 对象
  const jArr = app.parseAccountsFromText('[{"secret":"JBSWY3DPEHPK3PXP","label":"acme","issuer":"Acme"}]');
  check('JSON 数组解出 1 个', jArr.length === 1, 'got ' + jArr.length);
  check('JSON label=acme / issuer=Acme', jArr[0] && jArr[0].label === 'acme' && jArr[0].issuer === 'Acme');
  check('JSON secret 归一大写', jArr[0] && jArr[0].secret === 'JBSWY3DPEHPK3PXP');
  // JSON：单对象 + 字段别名（name→label, service→issuer, timer→period, algo）
  const jObj = app.parseAccountsFromText('{"secret":"gezdgnbvgy3tqojq","name":"bob","service":"GitHub","digits":8,"timer":60,"algo":"SHA256"}');
  check('JSON 单对象 + 别名解出 1 个', jObj.length === 1, 'got ' + jObj.length);
  check('JSON 别名映射（label/issuer/digits/period/algo）',
    jObj[0] && jObj[0].label === 'bob' && jObj[0].issuer === 'GitHub' && jObj[0].digits === 8 && jObj[0].period === 60 && jObj[0].algorithm === 'SHA-256');
  // JSON：{accounts:[...]} 包一层
  const jWrap = app.parseAccountsFromText('{"accounts":[{"secret":"JBSWY3DPEHPK3PXP"},{"secret":"GEZDGNBVGY3TQOJQ"}]}');
  check('JSON 包一层 {accounts:[...]} 解出 2 个', jWrap.length === 2, 'got ' + jWrap.length);
  // JSON：坏 secret 的记录被丢弃
  const jBad = app.parseAccountsFromText('[{"secret":"JBSWY3DPEHPK3PXP"},{"secret":"not-base32!!!"},{"label":"缺secret"}]');
  check('JSON 非法/缺 secret 记录被丢弃（只留 1）', jBad.length === 1, 'got ' + jBad.length);
  // JSON：数组里混 otpauth 字符串——由上层 URL 正则捡走，仍能出账号
  const jStr = app.parseAccountsFromText('["otpauth://totp/Acme:bob?secret=JBSWY3DPEHPK3PXP&issuer=Acme"]');
  check('JSON 数组里的 otpauth 字符串仍被解析', jStr.length === 1 && jStr[0].secret === 'JBSWY3DPEHPK3PXP');
  // CSV：带表头
  const csv = app.parseAccountsFromText('secret,label,issuer\nJBSWY3DPEHPK3PXP,acme,Acme\nGEZDGNBVGY3TQOJQ,bob,GitHub');
  check('CSV 表头 + 2 行解出 2 个', csv.length === 2, 'got ' + csv.length);
  check('CSV 首行字段（secret/label/issuer）', csv[0] && csv[0].secret === 'JBSWY3DPEHPK3PXP' && csv[0].label === 'acme' && csv[0].issuer === 'Acme');
  // CSV：列序打乱 + 引号内含逗号
  const csv2 = app.parseAccountsFromText('issuer,secret,label\n"Acme, Inc.",JBSWY3DPEHPK3PXP,work');
  check('CSV 乱序列 + 引号内逗号', csv2.length === 1 && csv2[0].issuer === 'Acme, Inc.' && csv2[0].label === 'work');
  // CSV：分号分隔（欧洲 Excel）
  const csvSemi = app.parseAccountsFromText('secret;label\nJBSWY3DPEHPK3PXP;acme');
  check('CSV 分号分隔', csvSemi.length === 1 && csvSemi[0].label === 'acme');
  // 无 secret 列头的逗号文本 → 不当 CSV（交回 URL 抠取，此处应为 0）
  check('无 secret 列头的普通逗号行 → 不误判为 CSV', app.parseAccountsFromText('hello, world, foo\nbar, baz, qux').length === 0);
  // 坏 JSON（YAML 冒号行）不抛错、不误伤：无 URL/secret= 故为 []
  check('坏 JSON 不抛错 → []', app.parseAccountsFromText('- secret: JBSWY3DPEHPK3PXP\n  label: x').length === 0);
  check('csvSplit 引号转义 ""', JSON.stringify(app.csvSplit('a,"b""c",d', ',')) === JSON.stringify(['a','b"c','d']));

  // ---- Google Authenticator 迁移码（protobuf）----
  group('迁移码');
  const secretBytes = [...app.base32Decode('JBSWY3DPEHPK3PXP')];
  const otp = [...pbField(0x0A, secretBytes), ...pbField(0x12, [...ascii('bob')]), ...pbField(0x1A, [...ascii('Acme')]), 0x20,1, 0x28,1, 0x30,2];
  const payload = new Uint8Array(pbField(0x0A, otp));
  const accts = app.decodeMigration(payload);
  check('迁移码解出 1 个账号', accts.length === 1, 'got ' + accts.length);
  if(accts[0]){
    check('迁移码 secret 往返 = JBSWY3DPEHPK3PXP', accts[0].secret === 'JBSWY3DPEHPK3PXP', 'got ' + accts[0].secret);
    check('迁移码 name=bob', accts[0].label === 'bob');
    check('迁移码 issuer=Acme', accts[0].issuer === 'Acme');
    check('迁移码 digits=6', accts[0].digits === 6);
    check('迁移码 algorithm=SHA-1', accts[0].algorithm === 'SHA-1');
  }
  const hotp = new Uint8Array(pbField(0x0A, [...pbField(0x0A, secretBytes), 0x30,1]));
  check('迁移码跳过 HOTP（type=1）', app.decodeMigration(hotp).length === 0);
  // 全链路：otpauth-migration:// URL → 账号
  const mig = app.parseMigration('otpauth-migration://offline?data=' + b64url(payload));
  check('parseMigration 全链路解出 1 个', mig.length === 1 && mig[0].secret === 'JBSWY3DPEHPK3PXP');
  check('parseMigration 坏 data → []', app.parseMigration('otpauth-migration://offline?data=%%%').length === 0);
  // ---- 损坏/截断的迁移码：干净失败，不产出垃圾账号（issue #4）----
  const truncated = payload.subarray(0, payload.length - 6); // 掐掉尾部：内层长度前缀声明的字节不够
  check('截断的迁移码 → []（不产出垃圾账号）', app.decodeMigration(truncated).length === 0, 'got ' + app.decodeMigration(truncated).length);
  const lyingLen = new Uint8Array([0x0A, 0x7F, ...otp]); // 外层长度前缀谎报 127 字节
  check('长度前缀越界 → []', app.decodeMigration(lyingLen).length === 0);
  const badVarint = new Uint8Array([0x0A, 0x03, 0x0A, 0xFF]); // varint 最高位悬空直到 EOF
  check('未终结的 varint → []', app.decodeMigration(badVarint).length === 0);
  // 同包一好一坏：坏的丢弃，好的保留
  const goodPlusBad = new Uint8Array([...pbField(0x0A, otp), ...pbField(0x0A, [0x0A, 0x50])]);
  const gpb = app.decodeMigration(goodPlusBad);
  check('一好一坏 → 只留好的 1 个', gpb.length === 1 && gpb[0].secret === 'JBSWY3DPEHPK3PXP', 'got ' + gpb.length);
  check('parseMigration 截断全链路 → []', app.parseMigration('otpauth-migration://offline?data=' + b64url(truncated)).length === 0);

  // ---- normalizeAccount ----
  group('normalizeAccount');
  const na = app.normalizeAccount({ secret: 'jbswy3dp ehpk3pxp', label: 'x', digits: '8', period: '60', algorithm: 'sha256' });
  check('secret 去空格并归一大写', na.secret === 'JBSWY3DPEHPK3PXP');
  check('digits/period 完整整数归一', na.digits === 8 && na.period === 60);
  check('algorithm 归一 SHA-256', na.algorithm === 'SHA-256');
  const n1 = app.normalizeAccount({ secret: 'jbswy3dpehpk3pxp' });
  const n2 = app.normalizeAccount({ secret: 'JBSWY3DPEHPK3PXP' });
  check('同密钥不同大小写归一后一致（去重键）', n1.secret === n2.secret);

  // ---- 看板链接编码往返 ----
  group('#board= 编码');
  app.state = { accounts: [
    app.normalizeAccount({ secret: 'JBSWY3DPEHPK3PXP', label: 'A', issuer: 'Acme', digits: 8, period: 60, algorithm: 'SHA-256' }),
    app.normalizeAccount({ secret: 'GEZDGNBVGY3TQOJQ', label: 'B' }),
  ] };
  const bp = app.encodeBoardParam();
  check('encodeBoardParam 非空且 URL-safe', !!bp && !/[+/=]/.test(bp));
  const back = app.decodeBoardParam(bp);
  check('board 往返数量 = 2', back.length === 2, 'got ' + back.length);
  check('board 往返字段完整（A/8位/60s/SHA-256）',
    back[0] && back[0].secret === 'JBSWY3DPEHPK3PXP' && back[0].label === 'A' && back[0].issuer === 'Acme'
    && back[0].digits === 8 && back[0].period === 60 && back[0].algorithm === 'SHA-256');
  check('decodeBoardParam 坏输入 → []', app.decodeBoardParam('!!!not-base64').length === 0);
  check('decodeBoardParam 非数组 JSON → []', app.decodeBoardParam(b64url([...ascii('{"a":1}')])).length === 0);

  // ---- 书签链接生成 ----
  group('buildAccountUrl');
  const u1 = new URLSearchParams(app.buildAccountUrl({ secret: 'JBSWY3DPEHPK3PXP', label: 'GitHub', issuer: 'Acme', digits: 8, period: 60, algorithm: 'SHA-256' }).split('#')[1]);
  check('非默认参数写入 hash', u1.get('secret') === 'JBSWY3DPEHPK3PXP' && u1.get('digits') === '8' && u1.get('period') === '60' && u1.get('algorithm') === '256');
  const u2 = new URLSearchParams(app.buildAccountUrl({ secret: 'JBSWY3DPEHPK3PXP', label: '', issuer: '', digits: 6, period: 30, algorithm: 'SHA-1' }).split('#')[1]);
  check('默认参数省略（hash 只有 secret）', u2.get('secret') === 'JBSWY3DPEHPK3PXP' && !u2.has('digits') && !u2.has('period') && !u2.has('algorithm') && !u2.has('label'));

  // ---- 验证码分组显示 ----
  group('fmtCode');
  check('6 位 → "123 456"', app.fmtCode('123456') === '123 456');
  check('7 位 → "1234 567"', app.fmtCode('1234567') === '1234 567');
  check('8 位 → "1234 5678"', app.fmtCode('12345678') === '1234 5678');
  check('空 → ""', app.fmtCode('') === '');

  group('异步回归：旧结果不能覆盖新上下文');
  const fixture = () => {
    const x = { ...app, state: {}, _codeRequest: 0, _boardRequests: [], _unmounted: false };
    x.setState = function(update, cb) { const patch = typeof update === 'function' ? update(this.state) : update; if (patch) this.state = { ...this.state, ...patch }; if (cb) cb(); };
    x.animateTo = function(code) { this.animated = code; };
    x.applyAccent = () => {};
    x.saveBoard = () => {};
    x.refreshBoardAll = () => {};
    x.t = () => ({ imported: n => String(n), alreadyInBoard: 'duplicate', titleBoard: 'test', importCap: n => String(n) });
    const queue = [];
    x.totp = () => new Promise((resolve, reject) => queue.push({resolve, reject}));
    x.queue = queue;
    return x;
  };
  const acct = { secret: 'JBSWY3DPEHPK3PXP', label: 'synthetic', issuer: '', digits: 6, period: 30, algorithm: 'SHA-1' };
  const originalNow = Date.now;
  Date.now = () => 60000;
  try {
    let x = fixture();
    x.state = { mode: 'board', accounts: [acct], boardLive: [{code: 'current'}] };
    let pending = x.computeBoardCodes([0]);
    x.state = { ...x.state, accounts: [{...acct, secret: 'MZXW6YTBOI'}], boardLive: [{code: 'replacement'}] };
    x.queue[0].resolve('111111'); await pending;
    check('替换同索引账号后丢弃旧 HMAC', x.state.boardLive[0].code === 'replacement');

    x = fixture(); x.state = {mode:'board',accounts:[acct,{...acct,label:'second'}],boardLive:[{},{}]};
    pending = x.computeBoardCodes([0,1]);
    x.state = {...x.state,accounts:[x.state.accounts[1]],boardLive:[{code:'survivor'}]};
    x.queue.forEach(q=>q.resolve('111111')); await pending;
    check('删除前卡后不污染前移账号或复活已删卡', x.state.boardLive.length===1 && x.state.boardLive[0].code==='survivor');

    x = fixture(); x.state = {mode:'board',accounts:[acct],boardLive:[{}]};
    pending = x.computeBoardCodes([0]);
    x.state = {...x.state,accounts:[],boardLive:[]}; x.queue[0].resolve('111111'); await pending;
    check('清空后旧异步结果不会复活卡片', x.state.boardLive.length===0);

    x = fixture(); x.state = {mode:'board',accounts:[acct],boardLive:[{}]};
    const old = x.computeBoardCodes([0]), latest = x.computeBoardCodes([0]);
    x.queue[1].resolve('222222'); await latest; x.queue[0].resolve('111111'); await old;
    check('同卡乱序完成保留最新请求', x.state.boardLive[0].code==='222222');

    x = fixture(); x.state = {mode:'board',accounts:[acct,{...acct,label:'other',period:60}],boardLive:[{},{}]};
    const firstCard=x.computeBoardCodes([0]), secondCard=x.computeBoardCodes([1]);
    x.queue[1].resolve('222222'); await secondCard; x.queue[0].resolve('111111'); await firstCard;
    check('不同周期的独立批次均可提交', x.state.boardLive[0].code==='111111' && x.state.boardLive[1].code==='222222');

    for (const kind of ['view','setup']) {
      const setup=kind==='setup', field=setup?'previewCode':'code';
      x=fixture(); x.state={...acct,mode:kind,parsed:acct,[field]:'current'};
      const refresh=()=>setup?x.refreshPreview():x.refresh();
      pending=refresh();
      x.state=setup?{...x.state,parsed:{...acct,secret:'MZXW6YTBOI'},[field]:'replacement'}:{...x.state,secret:'MZXW6YTBOI',[field]:'replacement'};
      x.queue[0].resolve('111111'); await pending;
      check(kind+' 切换账号丢弃旧成功结果与动画',x.state[field]==='replacement' && !x.animated);

      x=fixture(); x.state={...acct,mode:kind,parsed:acct,[field]:'current'};
      pending=refresh(); const newer=refresh(); x.queue[1].resolve('222222'); await newer; x.queue[0].reject(new Error('old failure')); await pending;
      check(kind+' 旧失败不能清空新成功',x.state[field]==='222222' && x.animated==='222222');

      x=fixture(); x.state={...acct,mode:kind,parsed:acct,[field]:'current'};
      pending=refresh(); x.state={...x.state,mode:'board'}; x.queue[0].resolve('111111'); await pending;
      check(kind+' 离开页面不写码或启动动画',x.state[field]==='' && !x.animated);

      x=fixture(); x.state={...acct,mode:kind,parsed:acct,[field]:'current'};
      pending=refresh(); Date.now=()=>90000; x.queue[0].resolve('111111'); await pending;
      check(kind+' 周期已过期丢弃迟到结果',x.state[field]===''); Date.now=()=>60000;
    }
    x=fixture(); x.state={...acct,mode:'view',code:'current',accounts:[acct]};
    pending=x.refresh(); x.goBoard(); x.goSetup(); x.state={...x.state,mode:'view'};
    x.queue[0].resolve('111111'); await pending;
    check('实际导航离开再回到相同账号仍拒绝原请求',x.state.code==='' && !x.animated);

    x=fixture(); x.state={mode:'board',accounts:[acct],boardLive:[{code:'old'}]};
    pending=x.computeBoardCodes([0]); x.goSetup(); x.goBoard(); x.queue[0].resolve('111111'); await pending;
    check('实际导航离开再回相同看板丢弃旧请求',x.state.boardLive[0].code==='');

    x=fixture(); x.state={...acct,mode:'view',shownDigits:['1'],animating:true,code:'111111'};
    pending=x.refresh();
    check('新周期请求开始清除上次数字和动画',x.state.code==='' && x.state.shownDigits===null && !x.state.animating);
    x.queue[0].reject(new Error('failure')); await pending;
    check('当前失败不会留下可见旧码',x.state.code==='' && x.state.shownDigits===null);

    x=fixture(); x.state={mode:'board',accounts:[acct],boardLive:[{code:'111111',codeFmt:'111 111'}]}; x._boardCounters=[1];
    x.boardTick();
    check('看板新周期计算中立即清除旧码',x.state.boardLive[0].code==='' && x.state.boardLive[0].codeFmt==='');
    x.queue[0].resolve('222222'); await Promise.resolve(); await Promise.resolve();

    x=fixture(); x.state={mode:'board',parsed:acct,previewCode:'111111'}; x._lastPrevCounter=2;
    x.goSetup(); x.tick();
    check('同周期返回设置立即重算已有预览',x.queue.length===1);
    x.queue[0].resolve('222222'); await Promise.resolve();

    const oldInterval=globalThis.setInterval, oldClear=globalThis.clearInterval;
    try {
      let callback, cleared=false;
      globalThis.setInterval=(fn)=>{callback=fn;return 1;}; globalThis.clearInterval=()=>{cleared=true;};
      x=fixture(); x.state={}; let valid=true;
      app.animateTo.call(x,'123456',()=>valid);
      const displayed=x.state.shownDigits; valid=false; cleared=false; callback();
      check('真实动画回调拒绝已失效请求',cleared && x.state.shownDigits===displayed);
    } finally { globalThis.setInterval=oldInterval; globalThis.clearInterval=oldClear; }

    group('完整身份去重回归');
    const variants=[acct,{...acct,algorithm:'SHA-256'},{...acct,digits:8},{...acct,period:60}];
    check('纯文本保留算法/位数/周期不同的全部账号',app.parseAccountsFromText(variants.map(a=>app.buildAccountUrl(a)).join('\n')).length===4);
    const aliases=[acct,{...acct,secret:'jbswy3dp ehpk3pxp====',algorithm:'sha1',digits:'6',period:'30'}];
    check('Base32 空格/大小写/填充和参数别名规范化去重',app.parseAccountsFromText(JSON.stringify(aliases)).length===1);
    check('标签/发行者中的分隔符不碰撞',app.accountIdentity({...acct,label:'a|b',issuer:'c'})!==app.accountIdentity({...acct,label:'a',issuer:'b|c'}));
    check('标签不同仍保留原语义',app.parseAccountsFromText(JSON.stringify([acct,{...acct,label:'other'}])).length===2);
    x=fixture(); x.state={accounts:[],boardLive:[]}; x.addAccounts(variants); x.addAccounts(aliases);
    check('实际加入看板保留四种配置并跳过规范化重复',x.state.accounts.length===4);
  } finally { Date.now=originalNow; }


  group('Strict OTP parameters · all entry points');
  {
    const secret = 'JBSWY3DPEHPK3PXP';
    const defaults = { digits: 6, period: 30, algorithm: 'SHA-1' };
    const missing = app.otpParams();
    check('Omitted parameters retain 6 / 30 / SHA-1 defaults', missing.valid && missing.digits === 6 && missing.period === 30 && missing.algorithm === 'SHA-1');
    for (const [raw, canonical] of [['SHA1', 'SHA-1'], ['sha-1', 'SHA-1'], ['1', 'SHA-1'], ['sha256', 'SHA-256'], ['SHA-256', 'SHA-256'], ['256', 'SHA-256'], ['sha512', 'SHA-512'], ['SHA-512', 'SHA-512'], ['512', 'SHA-512']]) {
      check('Recognized algorithm alias ' + raw, app.normAlgo(raw) === canonical);
    }
    for (const digits of [6, 7, 8, '6', '7', '8']) check('Supported digits ' + JSON.stringify(digits), app.clampDigits(digits) === Number(digits));
    for (const period of [10, 30, 300, '10', '30', '300']) check('Supported period ' + JSON.stringify(period), app.clampPeriod(period) === Number(period));
    const invalid = {
      digits: ['6.5', '6abc', '6e0', '0x6', '', ' ', '5', '9', null, false, [], {}, 6.5],
      period: ['30.5', '30abc', '3e1', '0x1e', '', ' ', '0', '9', '301', null, false, [], {}, 30.5],
      algorithm: ['MD5', 'SHA999', 'garbage256', 'SHA--256', 'SHA-256junk', '', ' ', null, false, 256, [], {}],
    };
    for (const [field, values] of Object.entries(invalid)) {
      for (const value of values) {
        const record = { secret, [field]: value };
        const p = { ...defaults, [field]: value };
        const options = app.otpParams(p.digits, p.period, p.algorithm);
        const name = field + '=' + JSON.stringify(value);
        check('Parameter helper rejects ' + name, !options.valid && options.reason === field);
        check('normalizeAccount rejects ' + name, app.normalizeAccount(record) === null);
        check('JSON record rejects ' + name, app.parseAccountsFromText(JSON.stringify(record)).length === 0);
        if (typeof value === 'string') {
          const suffix = '&' + field + '=' + encodeURIComponent(value);
          const parsed = app.parseInput('otpauth://totp/test?secret=' + secret + suffix);
          check('Setup parser rejects ' + name, parsed && !parsed.valid && parsed.reason === field);
          check('Bookmark parser rejects ' + name, app.parseAccountUrl('https://example.test/#secret=' + secret + suffix) === null);
          check('CSV parser rejects ' + name, app.parseAccountsFromText('secret,' + field + '\n' + secret + ',' + value).length === 0);
        }
      }
    }
    const defaultInput = app.parseInput('otpauth://totp/default?secret=' + secret);
    const defaultUrl = app.parseAccountUrl('https://example.test/#secret=' + secret);
    const defaultJson = app.parseAccountsFromText(JSON.stringify({ secret }))[0];
    const defaultCsv = app.parseAccountsFromText('secret,label\n' + secret + ',default')[0];
    for (const [name, a] of [['setup', defaultInput], ['bookmark', defaultUrl], ['JSON', defaultJson], ['CSV', defaultCsv]]) {
      check(name + ' defaults omitted parameters', a && a.valid && a.digits === 6 && a.period === 30 && a.algorithm === 'SHA-1');
    }
    check('JSON aliases cannot hide invalid period', app.parseAccountsFromText(JSON.stringify({ secret, timer: '30seconds' })).length === 0);
    check('JSON aliases cannot hide invalid algorithm', app.parseAccountsFromText(JSON.stringify({ secret, algo: 'MD5' })).length === 0);
    check('JSON mixed valid/invalid records keeps only the valid account', app.parseAccountsFromText(JSON.stringify([{ secret, algorithm: 'MD5' }, { secret, label: 'valid' }])).length === 1);
    check('CSV mixed valid/invalid rows keeps only the valid account', app.parseAccountsFromText('secret,label,period\n' + secret + ',bad,30s\n' + secret + ',valid,60').length === 1);
    const rows = [{ s: secret, l: 'bad algorithm', a: 'MD5' }, { s: secret, l: 'bad digits', d: '6abc' }, { s: secret, l: 'bad period', p: 30.5 }, { s: secret, l: 'null period', p: null }, null, { s: secret, l: 'valid default' }];
    const encoded = b64url([...new TextEncoder().encode(JSON.stringify(rows))]);
    const decoded = app.decodeBoardParam(encoded);
    check('Board decoder excludes invalid parameters and malformed records', decoded.length === 1 && decoded[0].label === 'valid default' && decoded[0].valid === true);
    check('Board decoder applies omitted defaults', decoded[0] && decoded[0].digits === 6 && decoded[0].period === 30 && decoded[0].algorithm === 'SHA-1');
    for (const [field, value] of [['digits', 6.5], ['digits', '6abc'], ['period', 0], ['period', '30s'], ['algorithm', 'MD5'], ['algorithm', null]]) {
      const p = { ...defaults, [field]: value };
      let rejected = false;
      try { await app.totp(secret, 59, p.digits, p.period, p.algorithm); }
      catch (e) { rejected = e.message === 'Invalid OTP ' + field; }
      check('TOTP refuses direct invalid ' + field + '=' + JSON.stringify(value), rejected);
    }
    await eq('TOTP missing parameters uses established defaults', app.totp(secret, 59), await app.totp(secret, 59, 6, 30, 'SHA-1'));

    // UI/storage fixtures mock browser effects only; all parsing and validation methods are production methods.
    const ui = Object.create(app);
    ui.t = () => ({ errDigits: 'Invalid OTP digits', errPeriod: 'Invalid OTP period', errAlgorithm: 'Unsupported OTP algorithm', errHotp: 'HOTP unsupported', errNoSecret: 'No secret', errInvalid: 'Invalid secret', titleApp: '2FA', titleBoard: 'Board', code: 'Code', titleSuffix: '', imported: (n) => 'Imported ' + n, alreadyInBoard: 'Already present', importCap: () => 'Limit' });
    ui.setState = function(patch, callback) { const next = typeof patch === 'function' ? patch(this.state) : patch; if (next) this.state = { ...this.state, ...next }; if (callback) callback(); };
    ui.refresh = () => {};
    ui.refreshPreview = () => {};
    ui.refreshBoardAll = () => {};
    const oldUrl = location.href, oldTitle = document.title, oldBoard = localStorage.getItem('easy2fa.board');
    try {
      localStorage.setItem('easy2fa.board', JSON.stringify(rows));
      const loaded = app.loadBoard();
      check('Cached board excludes invalid parameters while retaining valid records', loaded.length === 1 && loaded[0].label === 'valid default' && loaded[0].digits === 6);
      for (const [field, value, message] of [['digits', '6.5', 'Invalid OTP digits'], ['period', '30s', 'Invalid OTP period'], ['algorithm', 'MD5', 'Unsupported OTP algorithm']]) {
        const hash = '#secret=' + secret + '&' + field + '=' + encodeURIComponent(value);
        history.replaceState(null, '', location.pathname + location.search + hash);
        ui.state = { mode: 'view', code: '123456', previewCode: '123456', shownDigits: ['1'], secret, accounts: [] };
        ui.loadFromHash();
        check('Hash rejects ' + field + ' and clears previous code', ui.state.mode === 'setup' && !ui.state.code && !ui.state.previewCode && ui.state.parsed === null && ui.state.shownDigits === null);
        check('Hash reports specific ' + field + ' error', ui.state.error === message);
        check('Hash correction input preserves invalid ' + field, ui.state.inputValue.includes(field + '=' + encodeURIComponent(value)));
        ui.state = { mode: 'setup', previewCode: '123456', shownDigits: ['1'], inputLabel: '' };
        ui.commitParse('otpauth://totp/test?secret=' + secret + '&' + field + '=' + encodeURIComponent(value));
        check('Setup reports specific ' + field + ' error and clears preview', ui.state.error === message && ui.state.parsed === null && !ui.state.previewCode && ui.state.shownDigits === null);
      }
      history.replaceState(null, '', location.pathname + location.search + '#secret=' + secret);
      ui.state = { mode: 'setup' };
      ui.loadFromHash();
      check('Hash omitted parameters enters view using defaults', ui.state.mode === 'view' && ui.state.digits === 6 && ui.state.period === 30 && ui.state.algorithm === 'SHA-1');
      ui.state = { mode: 'board', accounts: [], boardLive: [] };
      ui.addAccounts([{ secret, algorithm: 'MD5' }, { secret, digits: '6abc' }, { secret, period: 30.5 }, null, { secret, label: 'valid' }]);
      check('addAccounts rejects invalid direct records', ui.state.accounts.length === 1 && ui.state.accounts[0].label === 'valid' && ui.state.accounts[0].period === 30);
      check('addAccounts persists only validated records', app.loadBoard().length === 1 && app.loadBoard()[0].label === 'valid');
    } finally {
      if (oldBoard === null) localStorage.removeItem('easy2fa.board'); else localStorage.setItem('easy2fa.board', oldBoard);
      history.replaceState(null, '', oldUrl);
      document.title = oldTitle;
    }
  }
// END APPENDABLE OTP PARAMETER TESTS

  render();
}

function render(){
  const out = document.getElementById('out');
  const tests = results.filter(r => !r.group);
  const passed = tests.filter(r => r.ok).length, total = tests.length;
  const sum = document.getElementById('summary');
  sum.textContent = (passed === total ? '✓ 全部通过 ' : '✗ 有失败 ') + passed + ' / ' + total;
  sum.className = passed === total ? 'ok' : 'fail';
  out.innerHTML = results.map(r =>
    r.group ? '<h2>' + r.group + '</h2>'
    : '<div class="row ' + (r.ok ? 'pass' : 'err') + '"><span class="s">' + (r.ok ? 'PASS' : 'FAIL') + '</span><span>' + r.name + (r.ok ? '' : ' <span class="d">— ' + r.detail + '</span>') + '</span></div>'
  ).join('');
}

run().catch(e => {
  render(); // 先渲染已完成的行，再覆盖 summary 为错误详情
  document.getElementById('summary').textContent = '✗ 运行出错：' + e.message + (/subtle|fetch/i.test(e.message || '') ? '（请用 localhost/HTTPS 打开）' : '');
  document.getElementById('summary').className = 'fail';
});
</script>
